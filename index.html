<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Kaamio brings trusted people and premium everyday services together. FIND IT. BOOK IT. DONE." />
    <title>Kaamio | Make room for the good stuff.</title>

    <!-- Google Fonts for premium typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Clash+Display:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Favicon -->
    <link rel="icon" href="/kaamio-logo.jpeg" type="image/jpeg">

    <!-- Open Graph / Social Media Tags -->
    <meta property="og:image" content="/kaamio-logo.jpeg">
    <meta name="twitter:image" content="/kaamio-logo.jpeg">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      :root {
        --teal-primary: #1fb5b3;
        --teal-light: #7ce4e1;
      }

      body {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        overflow-x: hidden;
      }

      .font-display {
        font-family: 'Clash Display', 'Inter', system-ui, sans-serif;
      }

      /* Smooth scroll behavior */
      html {
        scroll-behavior: smooth;
      }

      /* Premium gradient effects */
      .premium-gradient {
        background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
      }

      .teal-gradient {
        background: linear-gradient(135deg, var(--teal-primary) 0%, #159392 100%);
      }

      /* Subtle animations */
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .animate-fade-in {
        animation: fadeIn 0.6s ease-out forwards;
      }

      /* Premium hover effects */
      .premium-hover:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        transition: all 0.3s ease;
      }
    </style>
  </head>
  <body class="bg-white text-gray-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
